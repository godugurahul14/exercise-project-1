name: exercise-wf
on: push
jobs:
    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: GetCode
              uses: actions/checkout@v3
            - name: install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run Lint
              run: npm lint
            - name: Run Tests
              run: npm test
    Deploy-job:
        needs: test-job
        runs-on: ubuntu-latest
        steps:
            - name: GetCode
              uses: actions/checkout@v3
            - name: install NodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Building the app
              run: npm run build
            - name: Deploying
              run: echo "Deploying ...."